<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email confirmé — Santé Féminine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF7F2;--cream-dark:#F0EBE1;--rose:#E8C5BB;--rose-deep:#C9957F;--rose-pale:#F7EDE8;--text-dark:#2C2420;--text-mid:#6B5B52;--text-light:#A09080;--white:#FFFFFF;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--white);border-radius:24px;padding:48px 40px;width:460px;max-width:100%;box-shadow:0 16px 64px rgba(44,36,32,.12);text-align:center;}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;margin-bottom:28px;}
.logo span{color:var(--rose-deep);}
.icon{font-size:56px;margin-bottom:16px;}
.title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:400;margin-bottom:10px;}
.text{font-size:14px;color:var(--text-mid);font-weight:300;line-height:1.7;margin-bottom:28px;}
.btn{display:inline-block;padding:13px 28px;background:var(--text-dark);color:white;border-radius:12px;font-size:14px;font-weight:500;text-decoration:none;transition:all .2s;margin:4px;}
.btn:hover{background:var(--rose-deep);}
.btn.secondary{background:var(--rose-pale);color:var(--rose-deep);border:1.5px solid var(--rose-deep);}
.btn.secondary:hover{background:var(--rose-deep);color:white;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Santé <span>Féminine</span></div>
  <div class="icon">✅</div>
  <div class="title">Email confirmé !</div>
  <p class="text">
    Votre adresse email a été vérifiée avec succès.<br>
    Votre compte est maintenant <strong>actif</strong>.<br><br>
    Vous pouvez vous connecter à votre espace.
  </p>
  <a href="espace-medecin.html" class="btn">🩺 Espace médecin →</a>
  <a href="auth-connexion.html" class="btn secondary">👤 Espace patiente →</a>
</div>
</body>
</html>
